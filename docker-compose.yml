

services:
  mongo:
    image: mongo:6
    container_name: mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    
  api:
    build: .
    container_name: comandeiro-api
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - mongo
    # volumes:
    #   # - .:/app
    #   - /app/node_modules

volumes:
  mongo_data: