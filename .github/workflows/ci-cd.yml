name: CI/CD

on:
  push:
    branches: [kayuan1, main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  pull-requests: write

env:
  NODE_VERSION: '22.x'
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  validate:
    name: Test, lint and build
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run ESLint
        run: npx eslint "{src,apps,libs,test}/**/*.ts"

      - name: Run unit tests with coverage
        run: npm run test:cov -- --runInBand

      - name: Run end-to-end tests
        run: npm run test:e2e -- --runInBand
        env:
          MONGO_URI: mongodb://localhost:27017/comandeiro

      - name: Build application
        run: npm run build

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: coverage/
          if-no-files-found: ignore

  container:
    name: Build Docker image
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image without publishing
        if: github.ref != 'refs/heads/master'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish production image
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  promote:
    name: Open promotion pull request
    needs: [validate, container]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/kayuan1' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Choose next branch
        id: target
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == "kayuan1" ]]; then
            echo "branch=main" >> "$GITHUB_OUTPUT"
          else
            echo "branch=master" >> "$GITHUB_OUTPUT"
          fi

      - name: Create promotion pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: ${{ steps.target.outputs.branch }}
        run: |
          existing_pr=$(gh pr list --base "$TARGET_BRANCH" --head "$GITHUB_REF_NAME" --state open --json number --jq '.[0].number')
          if [[ -z "$existing_pr" ]]; then
            gh pr create \
              --base "$TARGET_BRANCH" \
              --head "$GITHUB_REF_NAME" \
              --title "Promote $GITHUB_REF_NAME to $TARGET_BRANCH" \
              --body "CI passed for $GITHUB_SHA. Review and merge this promotion PR to continue the pipeline."
          else
            echo "Promotion PR #$existing_pr already exists."
          fi
